  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ═══════════════════════════════════════════════════════════
    // PIXEL AVATAR
    // ═══════════════════════════════════════════════════════════

    const AVATAR_PALETTES = {
      rookie:  { H:'#39ff14', V:'#1a4a08', S:'#d4a574', E:'#111' },
      veteran: { H:'#ffd700', V:'#7a5500', S:'#d4a574', E:'#111' },
      legend:  { H:'#bf00ff', V:'#5a0080', S:'#d4a574', E:'#111' },
    };

    function getAvatarRows(bikeType, suspType) {
      const frameRow = bikeType === 'fully'
        ? ".BBBBXBBBB.."
        : ".BBBBBBBBB..";
      const forkRow = suspType === 'coil'
        ? "BKB......BKB"
        : "BB.......BB.";
      return [
        "....HHHH....",
        "...HHHHHH...",
        "..HHHHHHHH..",
        "..HVVVVVHH..",
        "..HSSSSSHH..",
        "..HSE.E.SH..",
        "..HSSSSSHH..",
        "BJJJJJJJJJJB",
        "BJJJDDJJJJJB",
        "..JJJJJJJJJ.",
        "...JJJJJJJ..",
        "....JJ.JJ...",
        "...BBB.BBB..",
        frameRow,
        forkRow,
        "WW.......WW.",
        ".WWW...WWW..",
      ];
    }

    function PixelAvatar({
      tier = 'rookie', px = 3,
      accentColor = null,
      bikeColor = null,
      jerseyJ = null, jerseyD = null,
      bikeType = 'hardtail', suspType = 'air',
      style = {}
    }) {
      const base = AVATAR_PALETTES[tier] || AVATAR_PALETTES.rookie;
      const pal = {
        ...base,
        H: accentColor || base.H,
        J: jerseyJ || '#e8e4dc',
        D: jerseyD || '#9a9890',
        B: bikeColor || '#1a1a1a',
        W: '#0d0d0d',
        X: '#888888',
        K: '#666666',
      };
      const rows = getAvatarRows(bikeType, suspType);
      const cols = rows[0].length;
      const rects = [];
      rows.forEach((row, ri) =>
        [...row].forEach((ch, ci) => {
          if (ch === '.') return;
          rects.push(<rect key={`${ri}-${ci}`} x={ci*px} y={ri*px} width={px} height={px} fill={pal[ch]||'#fff'}/>);
        })
      );
      return (
        <svg width={cols*px} height={rows.length*px} viewBox={`0 0 ${cols*px} ${rows.length*px}`}
          style={{ imageRendering:'pixelated', display:'block', ...style }}>
          {rects}
        </svg>
      );
    }

    function StatCard({ label, value, unit, accent='#39ff14', glowing=false, cardStyle='outlined' }) {
      const bg  = { outlined:'transparent', glass:'rgba(255,255,255,0.03)', solid:'#181411' };
      const bdr = { outlined: glowing?`${accent}bb`:'rgba(255,255,255,0.09)', glass:'rgba(255,255,255,0.13)', solid:'rgba(255,255,255,0.07)' };
      return (
        <div style={{ flex:1, background:bg[cardStyle]||'transparent', border:`1px solid ${bdr[cardStyle]}`,
          borderRadius:14, padding:'12px 12px 10px',
          boxShadow: glowing?`0 0 28px ${accent}44,inset 0 1px 0 ${accent}22`:'none' }}>
          <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:9, fontWeight:700,
            letterSpacing:'0.14em', color:'#5a5550', textTransform:'uppercase', marginBottom:6 }}>
            {label}
          </div>
          <div style={{ fontFamily:"'Space Mono',monospace", fontSize:20, fontWeight:700,
            color:'#e8e4dc', lineHeight:1, display:'flex', alignItems:'baseline', gap:3 }}>
            {value}<span style={{ fontSize:10, color:'#5a5550', fontWeight:400 }}>{unit}</span>
          </div>
        </div>
      );
    }

    function MiniChart({ data, accent='#39ff14', h=72, id='chart' }) {
      const vw=300, pad=8;
      const max=Math.max(...data), min=Math.min(...data), range=max-min||1;
      const pts=data.map((v,i)=>[ (i/(data.length-1))*vw, h-pad-((v-min)/range)*(h-pad*2) ]);
      const poly=pts.map(p=>p.join(',')).join(' ');
      const fill=[`0,${h}`,...pts.map(p=>p.join(',')),`${vw},${h}`].join(' ');
      return (
        <svg width="100%" viewBox={`0 0 ${vw} ${h}`} preserveAspectRatio="none" style={{display:'block'}}>
          <defs>
            <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={accent} stopOpacity="0.28"/>
              <stop offset="100%" stopColor={accent} stopOpacity="0.01"/>
            </linearGradient>
          </defs>
          <polygon points={fill} fill={`url(#${id})`}/>
          <polyline points={poly} fill="none" stroke={accent} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
          {pts.map(([x,y],i)=><circle key={i} cx={x} cy={y} r="3.5" fill={accent}/>)}
        </svg>
      );
    }

    function useTweaks(defaults) {
      const [values, setValues] = useState(defaults);
      const setTweak = useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
          ? keyOrEdits : { [keyOrEdits]: val };
        setValues(prev => ({ ...prev, ...edits }));
      }, []);
      return [values, setTweak];
    }

    function TweaksPanel({ title='Tweaks', children }) {
      const [open, setOpen] = useState(false);
      const dragRef = useRef(null);
      const offsetRef = useRef({ x:16, y:16 });

      const clamp = useCallback(() => {
        const panel = dragRef.current;
        if (!panel) return;
        const PAD = 16;
        const w = panel.offsetWidth, h = panel.offsetHeight;
        offsetRef.current = {
          x: Math.min(Math.max(PAD, offsetRef.current.x), window.innerWidth - w - PAD),
          y: Math.min(Math.max(PAD, offsetRef.current.y), window.innerHeight - h - PAD),
        };
        panel.style.right = offsetRef.current.x + 'px';
        panel.style.bottom = offsetRef.current.y + 'px';
      }, []);

      useEffect(() => { if (open) clamp(); }, [open, clamp]);

      useEffect(() => {
        const onMsg = e => {
          if (e?.data?.type === '__activate_edit_mode') setOpen(true);
          else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type:'__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const onDragStart = e => {
        const panel = dragRef.current;
        if (!panel) return;
        const r = panel.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const startRight = window.innerWidth - r.right;
        const startBottom = window.innerHeight - r.bottom;
        const move = ev => {
          offsetRef.current = { x: startRight-(ev.clientX-sx), y: startBottom-(ev.clientY-sy) };
          clamp();
        };
        const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      };

      if (!open) return null;
      return (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel" style={{ right:offsetRef.current.x, bottom:offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" onClick={() => { setOpen(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }}>✕</button>
            </div>
            <div className="twk-body">{children}</div>
          </div>
        </>
      );
    }

    function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

    function TweakRow({ label, children }) {
      return (
        <div className="twk-row">
          <div className="twk-lbl"><span>{label}</span></div>
          {children}
        </div>
      );
    }

    function TweakRadio({ label, value, options, onChange }) {
      const opts = options.map(o => typeof o === 'object' ? o : { value:o, label:o });
      const idx = Math.max(0, opts.findIndex(o => o.value === value));
      const n = opts.length;
      const maxLen = opts.reduce((m,o) => Math.max(m, String(o.label).length), 0);
      const fitsAsSegments = maxLen <= ({ 2:16, 3:10 }[n] ?? 0);
      if (!fitsAsSegments) {
        return (
          <TweakRow label={label}>
            <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
              {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </TweakRow>
        );
      }
      return (
        <TweakRow label={label}>
          <div className="twk-seg" role="radiogroup">
            <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx} * (100% - 4px) / ${n})`, width:`calc((100% - 4px) / ${n})` }}/>
            {opts.map(o => (
              <button key={o.value} type="button" role="radio" aria-checked={o.value===value} onClick={() => onChange(o.value)}>
                {o.label}
              </button>
            ))}
          </div>
        </TweakRow>
      );
    }

    function TweakColor({ label, value, options, onChange }) {
      const key = o => String(JSON.stringify(o)).toLowerCase();
      const cur = key(value);
      return (
        <TweakRow label={label}>
          <div className="twk-chips" role="radiogroup">
            {options.map((o, i) => {
              const colors = Array.isArray(o) ? o : [o];
              const hero = colors[0];
              const on = key(o) === cur;
              const light = (() => {
                const h = String(hero).replace('#','');
                const x = h.length===3?h.replace(/./g,c=>c+c):h.padEnd(6,'0');
                const n2 = parseInt(x.slice(0,6),16);
                if (isNaN(n2)) return true;
                const r2=(n2>>16)&255,g2=(n2>>8)&255,b2=n2&255;
                return r2*299+g2*587+b2*114>148000;
              })();
              return (
                <button key={i} type="button" className="twk-chip" role="radio"
                  aria-checked={on} data-on={on?'1':'0'}
                  style={{ background:hero }}
                  onClick={() => onChange(o)}>
                  {on && (
                    <svg viewBox="0 0 14 14" aria-hidden="true">
                      <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
                        strokeLinecap="round" strokeLinejoin="round"
                        stroke={light?'rgba(0,0,0,.78)':'#fff'}/>
                    </svg>
                  )}
                </button>
              );
            })}
          </div>
        </TweakRow>
      );
    }

    function UploadModal({ onClose, accent }) {
      const [step, setStep]       = useState(0);

      const [uploading, setUploading] = useState(false);
      const [done, setDone]       = useState(false);

      useEffect(() => {
        if (!recording) return;
        const id = setInterval(() => setElapsed(t => t+1), 1000);
        return () => clearInterval(id);
      }, [recording]);

      useEffect(() => {
        if (!uploading) return;
        const id = setTimeout(() => { setUploading(false); setDone(true); }, 2200);
        return () => clearTimeout(id);
      }, [uploading]);

      const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
      const stepLabel = ['QR CODE','AUFNEHMEN','HOCHLADEN'];

      return (
        <div style={{ position:'absolute', inset:0, zIndex:50, background:'rgba(6,5,3,0.98)',

              </div>
            ))}

          {step===0 && (
            <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              justifyContent:'center', padding:'0 24px', gap:18, textAlign:'center' }}>
              <div style={{ padding:12, border:`2px solid ${accent}`, borderRadius:14,
                boxShadow:`0 0 32px ${accent}33`, background:`${accent}06` }}>

                  {[
                    [0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],

                  ].map(([cx,cy],i)=>(
                    <rect key={i} x={cx} y={cy} width="1" height="1" fill={accent}/>
                  ))}
                </svg>
              </div>
              <div style={{ fontSize:18, fontWeight:700, color:'#e8e4dc' }}>QR-Code scannen</div>

              </div>
              <div style={{ width:'100%', background:'rgba(255,255,255,0.03)',
                border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 14px', textAlign:'left' }}>

      const [bikeConfig, setBikeConfig] = useState({
        bikeType:  'hardtail',
        bikeColor: '#1a1a1a',
        susp:      'air',
        material:  'alu',
        jerseyJ:   '#e8e4dc',
        jerseyD:   '#9a9890',
      });

      const sp = { accent:t.accent, cardStyle:t.cardStyle, dashLayout:t.dashLayout, bikeConfig };
      const screens = {
        dashboard:   <DashboardScreen   {...sp}/>,
        feed:        <FeedScreen        {...sp} onUpload={() => setUploadOpen(true)}/>,
        leaderboard: <LeaderboardScreen {...sp}/>,
        profile:     <ProfileScreen     {...sp} onBikeConfigChange={setBikeConfig}/>,
      };

      return (
        <>
          <IOSDevice width={393} height={852} dark>
            <div style={{ position:'absolute', top:0, left:0, right:0, height:64, zIndex:5, pointerEvents:'none',
              background:`linear-gradient(to bottom, ${t.accent}0e 0%, transparent 100%)` }}/>

            <div style={{ position:'absolute', top:60, left:0, right:0, bottom:0, background:'#0c0a07', overflow:'hidden' }}>
              <AppHeader accent={t.accent} bikeConfig={bikeConfig}/>
              <div style={{ position:'absolute', top:48, left:0, right:0, bottom:0, overflow:'hidden' }}>
                <ScreenWrap key={activeTab} id={activeTab}>
                  <div style={{ paddingTop:6 }}>
                    {screens[activeTab]}
                  </div>
                </ScreenWrap>
              </div>
              {uploadOpen && (
                <div style={{ position:'absolute', top:48, left:0, right:0, bottom:66, zIndex:40 }}>
                  <UploadModal onClose={() => setUploadOpen(false)} accent={t.accent}/>
                </div>
              )}
            </div>

            <TabBar active={activeTab} onChange={setActiveTab} accent={t.accent}/>
          </IOSDevice>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Akzentfarbe"/>
            <TweakColor label="Farbe" value={t.accent}
              options={['#39ff14','#00e5ff','#ff6b00','#bf00ff','#ffd700']}
              onChange={v => setTweak('accent', v)}/>
            <TweakSection label="Kartenstil"/>
            <TweakRadio label="Stil" value={t.cardStyle}
              options={['outlined','glass','solid']}
              onChange={v => setTweak('cardStyle', v)}/>
            <TweakSection label="Dashboard"/>
            <TweakRadio label="Layout" value={t.dashLayout}
              options={['hud','cards']}
              onChange={v => setTweak('dashLayout', v)}/>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
