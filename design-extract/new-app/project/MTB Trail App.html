<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOE MOEA TRAILS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:#080604;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;padding:28px 16px}
    button{font-family:inherit}
    ::-webkit-scrollbar{width:0;height:0}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
    @keyframes upload-bar{from{width:0}to{width:100%}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="pixel-avatar.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#39ff14",
      "cardStyle": "glass",
      "dashLayout": "hud"
    }/*EDITMODE-END*/;

    // ── TAB ICONS ────────────────────────────────────────────

    const ICONS = {
      dashboard: (c) => (
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="8.5" stroke={c} strokeWidth="1.4"/>
          <path d="M11 11L7.5 7.5" stroke={c} strokeWidth="1.5" strokeLinecap="round"/>
          <circle cx="11" cy="11" r="1.5" fill={c}/>
          <path d="M5.5 14.5A7 7 0 0115 5.5" stroke={c} strokeWidth="1.4" strokeLinecap="round" opacity="0.35"/>
        </svg>
      ),
      feed: (c) => (
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="2" y="4" width="18" height="14" rx="3" stroke={c} strokeWidth="1.4"/>
          <polygon points="9,8.5 15.5,11 9,13.5" fill={c}/>
        </svg>
      ),
      leaderboard: (c) => (
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <rect x="1"  y="13" width="6" height="8" rx="1" fill={c} opacity="0.45"/>
          <rect x="8"  y="8"  width="6" height="13" rx="1" fill={c}/>
          <rect x="15" y="10" width="6" height="11" rx="1" fill={c} opacity="0.45"/>
          <path d="M6.5 5.5L11 2l4.5 3.5" stroke={c} strokeWidth="1.4" strokeLinejoin="round"/>
        </svg>
      ),
      profile: (c) => (
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="7" r="3.5" stroke={c} strokeWidth="1.4"/>
          <path d="M3 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke={c} strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
      ),
    };

    // ── APP HEADER ────────────────────────────────────────────

    function AppHeader({ accent, bikeConfig }) {
      return (
        <div style={{
          height:48, display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'0 16px',
          borderBottom:'1px solid rgba(255,255,255,0.06)',
          background:'rgba(12,10,7,0.95)',
          backdropFilter:'blur(8px)',
        }}>
          {/* Brand wordmark — MOE MOEA / TRAILS */}
          <div style={{ lineHeight:1 }}>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22,
              letterSpacing:'0.12em', color:'#e8e4dc' }}>MOE MOEA</div>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:11,
              letterSpacing:'0.28em', color:'#cc1a1a', marginTop:-1 }}>TRAILS</div>
          </div>
          {/* Notification + avatar */}
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:6, height:6, borderRadius:'50%', background:accent,
              boxShadow:`0 0 8px ${accent}` }}/>
            <div style={{ width:36, height:36, borderRadius:9, background:'#181411',
              border:`1.5px solid ${accent}44`,
              display:'flex', alignItems:'center', justifyContent:'center',
              overflow:'hidden', boxShadow:`0 0 14px ${accent}22` }}>
              <PixelAvatar tier="rookie" px={2} accentColor={accent}
                bikeColor={bikeConfig.bikeColor}
                jerseyJ={bikeConfig.jerseyJ} jerseyD={bikeConfig.jerseyD}
                bikeType={bikeConfig.bikeType} suspType={bikeConfig.susp}/>
            </div>
          </div>
        </div>
      );
    }

    // ── TAB BAR ───────────────────────────────────────────────

    function TabBar({ active, onChange, accent }) {
      const tabs = [
        { id:'dashboard',   label:'Dashboard' },
        { id:'feed',        label:'Feed'       },
        { id:'leaderboard', label:'Rangliste'  },
        { id:'profile',     label:'Profil'     },
      ];
      return (
        <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:30,
          background:'rgba(10,8,5,0.97)', borderTop:'1px solid rgba(255,255,255,0.07)',
          display:'flex', paddingBottom:26 }}>
          {tabs.map(tab => {
            const on = active === tab.id;
            return (
              <button key={tab.id} onClick={() => onChange(tab.id)} style={{
                flex:1, background:'none', border:'none', cursor:'pointer',
                padding:'9px 0 4px', display:'flex', flexDirection:'column',
                alignItems:'center', gap:3, color: on ? accent : '#3a3530',
                transition:'color 0.15s',
              }}>
                {ICONS[tab.id](on ? accent : '#3a3530')}
                <span style={{ fontFamily:"'Space Grotesk',sans-serif",
                  fontSize:8, fontWeight: on?700:500, letterSpacing:'0.07em',
                  textTransform:'uppercase' }}>{tab.label}</span>
                {on && <div style={{ width:18, height:2, borderRadius:99,
                  background:accent, boxShadow:`0 0 7px ${accent}`, marginTop:1 }}/>}
              </button>
            );
          })}
        </div>
      );
    }

    // ── UPLOAD MODAL ──────────────────────────────────────────

    function UploadModal({ onClose, accent }) {
      const [step, setStep]         = useState(0);
      const [recording, setRec]     = useState(false);
      const [elapsed, setElapsed]   = useState(0);
      const [uploading, setUploading] = useState(false);
      const [done, setDone]         = useState(false);

      useEffect(() => {
        if (!recording) return;
        const id = setInterval(() => setElapsed(t => t+1), 1000);
        return () => clearInterval(id);
      }, [recording]);

      useEffect(() => {
        if (!uploading) return;
        const id = setTimeout(() => { setUploading(false); setDone(true); }, 2200);
        return () => clearTimeout(id);
      }, [uploading]);

      const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

      const stepLabel = ['QR CODE','AUFNEHMEN','HOCHLADEN'];

      return (
        <div style={{ position:'absolute', inset:0, zIndex:50, background:'rgba(6,5,3,0.98)',
          display:'flex', flexDirection:'column', fontFamily:"'Space Grotesk',sans-serif" }}>

          {/* Header */}
          <div style={{ padding:'14px 16px 10px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:20, letterSpacing:'0.14em', color:'#e8e4dc' }}>
              Video Einreichen
            </div>
            <button onClick={onClose} style={{ background:'none', border:'1px solid rgba(255,255,255,0.1)',
              borderRadius:8, width:30, height:30, cursor:'pointer',
              color:'#5a5550', fontSize:16, display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
          </div>

          {/* Step bar */}
          <div style={{ display:'flex', gap:6, padding:'0 16px 20px' }}>
            {stepLabel.map((s,i) => (
              <div key={i} style={{ flex:1, textAlign:'center' }}>
                <div style={{ height:2, borderRadius:99, marginBottom:5,
                  background: step>=i?accent:'rgba(255,255,255,0.08)' }}/>
                <div style={{ fontSize:7, letterSpacing:'0.12em',
                  color: step>=i?accent:'#3a3530', textTransform:'uppercase' }}>{s}</div>
              </div>
            ))}
          </div>

          {/* ── STEP 0: QR ── */}
          {step===0 && (
            <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              justifyContent:'center', padding:'0 24px', gap:18, textAlign:'center' }}>
              {/* QR grid */}
              <div style={{ padding:12, border:`2px solid ${accent}`, borderRadius:14,
                boxShadow:`0 0 32px ${accent}33`, background:`${accent}06` }}>
                <svg width="80" height="80" viewBox="0 0 7 7">
                  {/* QR-like pattern */}
                  {[
                    [0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],
                    [4,0],[5,0],[6,0],[4,1],[6,1],[4,2],[5,2],[6,2],
                    [0,4],[1,4],[2,4],[0,5],[2,5],[0,6],[1,6],[2,6],
                    [3,0],[3,3],[3,6],[1,3],[5,3],[4,4],[6,4],[5,5],[3,5],[4,6],[6,6],
                  ].map(([cx,cy],i)=>(
                    <rect key={i} x={cx} y={cy} width="1" height="1" fill={accent}/>
                  ))}
                </svg>
              </div>
              <div style={{ fontSize:18, fontWeight:700, color:'#e8e4dc' }}>QR-Code scannen</div>
              <div style={{ fontSize:12, color:'#5a5550', lineHeight:1.7 }}>
                Halte die Kamera vor den QR-Code<br/>am Photo-Spot des Trails.<br/>Er muss am Anfang des Videos sichtbar sein!
              </div>
              <div style={{ width:'100%', background:'rgba(255,255,255,0.03)',
                border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 14px', textAlign:'left' }}>
                {['QR-Code am Spot aufsuchen','Code vollständig im Bild halten','Grünes Licht abwarten'].map((t,i)=>(
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding:'4px 0' }}>
                    <div style={{ width:18, height:18, borderRadius:'50%', border:`1.5px solid ${accent}`,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:8, color:accent, flexShrink:0, fontFamily:"'Space Mono',monospace" }}>{i+1}</div>
                    <span style={{ fontSize:12, color:'#7a7570' }}>{t}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => setStep(1)} style={{ width:'100%', background:accent, border:'none',
                borderRadius:12, padding:'14px', cursor:'pointer', fontSize:14, fontWeight:700, color:'#000',
                letterSpacing:'0.04em' }}>QR erkannt → Weiter</button>
            </div>
          )}

          {/* ── STEP 1: RECORD ── */}
          {step===1 && (
            <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              justifyContent:'center', padding:'0 24px', gap:18, textAlign:'center' }}>
              {/* Viewfinder */}
              <div style={{ width:180, height:130, border:`2px solid ${recording?'#ff3333':accent}`,
                borderRadius:10, position:'relative', background:'#080604',
                boxShadow: recording?'0 0 32px #ff333333':`0 0 20px ${accent}22`, overflow:'hidden' }}>
                {/* Corner brackets */}
                {[[0,0,'top','left'],[0,1,'top','right'],[1,0,'bottom','left'],[1,1,'bottom','right']].map(([r,c,vt,hz],i) => (
                  <div key={i} style={{ position:'absolute', width:14, height:14,
                    [vt]:-1, [hz]:-1,
                    borderTop: r===0?`3px solid ${recording?'#ff3333':accent}`:'none',
                    borderBottom: r===1?`3px solid ${recording?'#ff3333':accent}`:'none',
                    borderLeft: c===0?`3px solid ${recording?'#ff3333':accent}`:'none',
                    borderRight: c===1?`3px solid ${recording?'#ff3333':accent}`:'none',
                  }}/>
                ))}
                <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:8 }}>
                  {recording && (
                    <div style={{ width:8, height:8, borderRadius:'50%', background:'#ff3333',
                      boxShadow:'0 0 10px #ff3333', animation:'pulse 1s ease-in-out infinite' }}/>
                  )}
                  <div style={{ fontFamily:"'Space Mono',monospace", fontSize:24, fontWeight:700,
                    color: recording?'#ff3333':accent }}>{fmt(elapsed)}</div>
                  {!recording && <div style={{ fontSize:9, color:'#3a3530', letterSpacing:'0.1em' }}>BEREIT</div>}
                </div>
              </div>
              <div style={{ fontSize:12, color:'#5a5550', lineHeight:1.6 }}>
                {recording ? 'Aufnahme läuft — QR-Code muss am Anfang sichtbar sein' : 'Starte die Aufnahme. QR-Code zuerst ins Bild!'}
              </div>
              {!recording
                ? <button onClick={() => setRec(true)} style={{ width:'100%', background:accent,
                    border:'none', borderRadius:12, padding:'14px', cursor:'pointer',
                    fontSize:14, fontWeight:700, color:'#000', letterSpacing:'0.04em' }}>
                    ● Aufnahme starten
                  </button>
                : <div style={{ display:'flex', flexDirection:'column', gap:8, width:'100%' }}>
                    <button onClick={() => { setRec(false); setStep(2); }} style={{
                      width:'100%', background:'rgba(255,51,51,0.12)', border:'1.5px solid #ff3333',
                      borderRadius:12, padding:'14px', cursor:'pointer',
                      fontSize:14, fontWeight:700, color:'#ff3333' }}>
                      ■ Stoppen & weiter
                    </button>
                  </div>
              }
            </div>
          )}

          {/* ── STEP 2: UPLOAD ── */}
          {step===2 && (
            <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center',
              justifyContent:'center', padding:'0 24px', gap:18, textAlign:'center' }}>
              {done ? (
                <>
                  <div style={{ width:64, height:64, borderRadius:'50%', background:`${accent}18`,
                    border:`2px solid ${accent}`, display:'flex', alignItems:'center', justifyContent:'center',
                    boxShadow:`0 0 32px ${accent}44` }}>
                    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
                      <path d="M5 13l6 6L21 7" stroke={accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                  <div style={{ fontSize:20, fontWeight:700, color:accent }}>Clip eingereicht!</div>
                  <div style={{ fontSize:12, color:'#5a5550', lineHeight:1.7 }}>
                    Dein Video wurde validiert und ist<br/>jetzt im Feed sichtbar.<br/>Die Community kann abstimmen.
                  </div>
                  <button onClick={onClose} style={{ width:'100%', background:accent, border:'none',
                    borderRadius:12, padding:'14px', cursor:'pointer',
                    fontSize:14, fontWeight:700, color:'#000' }}>Fertig</button>
                </>
              ) : (
                <>
                  <div style={{ width:56, height:56, borderRadius:'50%',
                    background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.09)',
                    display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                      <path d="M12 19V5M12 5L7 10M12 5l5 5" stroke={accent} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                      <path d="M3 19h18" stroke={accent} strokeWidth="2" strokeLinecap="round"/>
                    </svg>
                  </div>
                  <div style={{ fontSize:18, fontWeight:700, color:'#e8e4dc' }}>Clip hochladen</div>
                  <div style={{ fontSize:12, color:'#5a5550' }}>
                    Aufnahme: {fmt(elapsed)} · QR-Code validiert ✓
                  </div>
                  {uploading && (
                    <div style={{ width:'100%' }}>
                      <div style={{ height:5, background:'rgba(255,255,255,0.07)', borderRadius:99, overflow:'hidden' }}>
                        <div style={{ height:'100%', background:accent, borderRadius:99,
                          animation:'upload-bar 2.2s linear forwards' }}/>
                      </div>
                      <div style={{ fontSize:10, color:'#5a5550', marginTop:8 }}>Wird hochgeladen...</div>
                    </div>
                  )}
                  <button onClick={() => setUploading(true)} disabled={uploading} style={{
                    width:'100%', background: uploading?'rgba(255,255,255,0.04)':accent,
                    border:'none', borderRadius:12, padding:'14px', fontSize:14, fontWeight:700,
                    color: uploading?'#3a3530':'#000', cursor: uploading?'not-allowed':'pointer' }}>
                    {uploading ? 'Wird hochgeladen…' : '▲ Hochladen & einreichen'}
                  </button>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── SCREEN FADE WRAPPER ───────────────────────────────────

    function ScreenWrap({ children, id }) {
      const [vis, setVis] = useState(false);
      useEffect(() => { const t=setTimeout(()=>setVis(true),30); return ()=>clearTimeout(t); }, []);
      useEffect(() => { setVis(false); }, [id]);
      return (
        <div style={{ opacity:vis?1:0, transform:vis?'translateY(0)':'translateY(5px)',
          transition:'opacity 0.18s ease, transform 0.18s ease', height:'100%', overflowY:'auto' }}>
          {children}
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [uploadOpen, setUploadOpen] = useState(false);
      const [bikeConfig, setBikeConfig] = useState({
        bikeType:  'hardtail',
        bikeColor: '#1a1a1a',
        susp:      'air',
        material:  'alu',
        jerseyJ:   '#e8e4dc',
        jerseyD:   '#9a9890',
      });

      const sp = { accent:t.accent, cardStyle:t.cardStyle, dashLayout:t.dashLayout, bikeConfig };
      const screens = {
        dashboard:   <DashboardScreen   {...sp}/>,
        feed:        <FeedScreen        {...sp} onUpload={() => setUploadOpen(true)}/>,
        leaderboard: <LeaderboardScreen {...sp}/>,
        profile:     <ProfileScreen     {...sp} onBikeConfigChange={setBikeConfig}/>,
      };

      return (
        <>
          <IOSDevice width={393} height={852} dark>
            {/* Green status-bar tint */}
            <div style={{ position:'absolute', top:0, left:0, right:0, height:64, zIndex:5, pointerEvents:'none',
              background:`linear-gradient(to bottom, ${t.accent}0e 0%, transparent 100%)` }}/>

            {/* Content container */}
            <div style={{ position:'absolute', top:60, left:0, right:0, bottom:0, background:'#0c0a07', overflow:'hidden' }}>
              <AppHeader accent={t.accent} bikeConfig={bikeConfig}/>
              {/* Scrollable screen */}
              <div style={{ position:'absolute', top:48, left:0, right:0, bottom:0, overflow:'hidden' }}>
                <ScreenWrap key={activeTab} id={activeTab}>
                  <div style={{ paddingTop:6 }}>
                    {screens[activeTab]}
                  </div>
                </ScreenWrap>
              </div>
              {/* Upload modal (above screen, below tab bar) */}
              {uploadOpen && (
                <div style={{ position:'absolute', top:48, left:0, right:0, bottom:66, zIndex:40 }}>
                  <UploadModal onClose={() => setUploadOpen(false)} accent={t.accent}/>
                </div>
              )}
            </div>

            <TabBar active={activeTab} onChange={setActiveTab} accent={t.accent}/>
          </IOSDevice>

          <TweaksPanel>
            <TweakSection label="Akzentfarbe"/>
            <TweakColor label="Farbe" value={t.accent}
              options={['#39ff14','#00e5ff','#ff6b00','#bf00ff','#ffd700']}
              onChange={v => setTweak('accent', v)}/>
            <TweakSection label="Kartenstil"/>
            <TweakRadio label="Stil" value={t.cardStyle}
              options={['outlined','glass','solid']}
              onChange={v => setTweak('cardStyle', v)}/>
            <TweakSection label="Dashboard"/>
            <TweakRadio label="Layout" value={t.dashLayout}
              options={['hud','cards']}
              onChange={v => setTweak('dashLayout', v)}/>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
